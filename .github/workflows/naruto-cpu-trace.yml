name: Naruto private-ROM CPU trace

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/naruto-cpu-trace.yml"

permissions:
  contents: read

concurrency:
  group: naruto-private-cpu-trace
  cancel-in-progress: true

jobs:
  trace-private-rom:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Trace private ROM CPU state' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    env:
      API: https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
      RELEASE_TAG: research-emulator-pcsx-redux-2026-10-15
      ROM_NAME: Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin
      CUE_NAME: Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue
      BIOS_NAME: openbios-chunked.bin
      EXPECTED_ROM_SIZE: "325989552"
      EXPECTED_ROM_SHA256: 58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88
      PCSX_SOURCE_COMMIT: 6b9df482d7b77b9ae218d9c48c1ce1a43c265206

    steps:
      - name: Check required secret
        env:
          NARUTO_RESEARCH_READ_TOKEN: ${{ secrets.NARUTO_RESEARCH_READ_TOKEN }}
        run: |
          set -eu
          if [ -z "$NARUTO_RESEARCH_READ_TOKEN" ]; then
            echo "::error::Missing NARUTO_RESEARCH_READ_TOKEN. See docs/PRIVATE_ROM_SETUP.md."
            exit 1
          fi
          echo "Private release read token is present; value will not be printed."

      - name: Prepare temporary workspace
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq libcapstone-dev
          WORK="$RUNNER_TEMP/naruto-cpu-trace"
          mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "Temporary workspace prepared."

      - name: Download and verify private game files and emulator
        env:
          NARUTO_RESEARCH_READ_TOKEN: ${{ secrets.NARUTO_RESEARCH_READ_TOKEN }}
        run: |
          set -eu
          cd "$WORK"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $NARUTO_RESEARCH_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/$RELEASE_TAG" -o release.json

          fetch_asset() {
            name="$1"
            output="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then
              echo "::error::Release asset missing: $name"
              exit 1
            fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $NARUTO_RESEARCH_READ_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }
          fetch_asset "$ROM_NAME" game.bin
          fetch_asset "$CUE_NAME" game.cue
          fetch_asset "$BIOS_NAME" openbios-chunked.bin
          test "$(stat -c '%s' game.bin)" = "$EXPECTED_ROM_SIZE"
          echo "$EXPECTED_ROM_SHA256  game.bin" | sha256sum --check -

          python3 - <<'PY'
          from pathlib import Path
          raw = Path("game.cue").read_bytes()
          cue = raw.decode("utf-8-sig").replace("\r\n", "\n").replace("\r", "\n")
          lines = cue.splitlines()
          file_indices = [i for i, line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          has_track = any(line.lstrip().upper().startswith("TRACK ") for line in lines)
          if len(file_indices) != 1 or not has_track:
              raise SystemExit("CUE structure invalid: expected one FILE directive and at least one TRACK directive.")
          lines[file_indices[0]] = 'FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines) + "\n", encoding="ascii")
          print("CUE structure verified; only the temporary FILE reference was normalized.")
          PY
          echo "ROM size and SHA-256 verified."

      - name: Build pinned upstream PCSX-Redux with CPU trace support
        run: |
          set -eu
          echo "PCSX_SOURCE_COMMIT=$PCSX_SOURCE_COMMIT"
          git clone --filter=blob:none --no-checkout https://github.com/grumpycoders/pcsx-redux.git "$WORK/pcsx-redux"
          git -C "$WORK/pcsx-redux" checkout --detach "$PCSX_SOURCE_COMMIT"
          git -C "$WORK/pcsx-redux" submodule update --init --recursive
          test -f "$WORK/pcsx-redux/src/core/cputrace.h"
          grep -q 'Trace = {' "$WORK/pcsx-redux/src/core/pcsxffi.lua"
          git -C "$WORK/pcsx-redux" rev-parse HEAD
          docker version
          docker pull ghcr.io/grumpycoders/pcsx-redux-build:latest
          docker image inspect --format 'PCSX_BUILD_IMAGE={{index .RepoDigests 0}}' ghcr.io/grumpycoders/pcsx-redux-build:latest
          docker run --rm -i -u "$(id -u):$(id -g)" -w /project \
            -v "$WORK/pcsx-redux:/project" \
            ghcr.io/grumpycoders/pcsx-redux-build:latest make -j2
          test -x "$WORK/pcsx-redux/pcsx-redux"
          echo "PCSX runtime shared-library dependencies:"
          ldd "$WORK/pcsx-redux/pcsx-redux" | tee "$WORK/pcsx-runtime-deps.txt"
          if grep -q 'not found' "$WORK/pcsx-runtime-deps.txt"; then
            echo "::error::PCSX-Redux has unresolved host runtime dependencies."
            exit 1
          fi
          echo "PCSX_BUILD_RESULT=compiled pinned source with built-in CPU trace API and resolved runtime dependencies"

      - name: Capture a short built-in CPU trace around executable entry
        run: |
          set -eu
          cd "$WORK"
          FULL_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print("PAD_SETUP=port1 analog device connected and remapped")

          local vsyncs = 0
          local traceStart = 1620
          local traceStop = 1680
          PCSX.CPU.Trace.clear()
          PCSX.CPU.Trace.disable()
          local listener
          listener = PCSX.Events.createEventListener('GPU::Vsync', function()
            vsyncs = vsyncs + 1
            if vsyncs % 30 == 0 then
              print(string.format("VSYNC_TRACE frame=%d", vsyncs))
            end
            if vsyncs == traceStart then
              PCSX.CPU.Trace.clear()
              PCSX.CPU.Trace.enable()
              print("CPU_TRACE_WINDOW=enabled frame=" .. tostring(vsyncs))
            elseif vsyncs == traceStop then
              PCSX.CPU.Trace.disable()
              local total = PCSX.CPU.Trace.size()
              print("CPU_TRACE_SIZE=" .. tostring(total))
              local first = math.max(0, total - 80)
              for i = first, total - 1 do
                print("CPU_TRACE_LINE index=" .. tostring(i) .. " " .. PCSX.CPU.Trace.getLine(i))
              end
              print("CPU_TRACE_WINDOW=disabled and last 80 records printed")
            end
          end)
          print("VSYNC_TRACE=counter listener installed; built-in CPU trace scheduled for frames 1620-1680")
          LUA
          )
          set +e
          timeout --signal=TERM --kill-after=5s 35s \
            env HOME="$WORK/home-trace" LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 \
            "$WORK/pcsx-redux/pcsx-redux" -no-ui \
            -bios "$WORK/openbios-chunked.bin" -iso "$WORK/game-run.cue" \
            -exec "$FULL_SETUP" -run -interpreter -softgpu \
            -stdout -lua_stdout -logfile "$WORK/cpu-trace.log" > "$WORK/cpu-trace.stdout" 2>&1
          rc=$?
          set -e
          echo "TRACE_PROCESS_EXIT=$rc (124 means the 35-second observation cap was reached)"
          echo "Selected boot, VSync and instruction-trace markers:"
          grep -E 'PAD_SETUP=|VSYNC_TRACE|CPU_TRACE|Loaded BIOS:|OpenBIOS detected|CD-ROM Label:|CD-ROM ID:|CD-ROM EXE Name:|SYSTEM.CNF|BOOT =|\[CHUNK1\] done|EXEC:PC0|Execute !|Unknown command for pad|FATAL|Exception|Error|ERROR' \
            "$WORK/cpu-trace.stdout" "$WORK/cpu-trace.log" 2>/dev/null | tail -160 || true
          if grep -q 'VSYNC_TRACE frame=' "$WORK/cpu-trace.stdout" "$WORK/cpu-trace.log" 2>/dev/null; then
            echo "TRACE_RESULT=VSync counter callbacks fired."
          else
            echo "TRACE_RESULT=No VSync counter samples recorded; inspect startup/boot markers before interpreting a guest hang."
          fi
          if grep -q 'CPU_TRACE_LINE index=' "$WORK/cpu-trace.stdout" "$WORK/cpu-trace.log" 2>/dev/null; then
            echo "CPU_TRACE_RESULT=Built-in instruction records were printed."
          else
            echo "CPU_TRACE_RESULT=No built-in instruction records were printed."
          fi
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::warning::Trace process exited early with code $rc"
            tail -120 "$WORK/cpu-trace.stdout" || true
          fi

      - name: Remove temporary game files, BIOS, emulator and logs
        if: always()
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then
            rm -f "$WORK/game.bin" "$WORK/game.cue" "$WORK/game-run.cue" "$WORK/openbios-chunked.bin" "$WORK/release.json"
            rm -f "$WORK/cpu-trace.log" "$WORK/cpu-trace.stdout"
            rm -rf "$WORK/pcsx-redux" "$WORK/home-trace"
          fi
          echo "Temporary ROM, CUE, BIOS, emulator and trace logs removed from the ephemeral runner."
