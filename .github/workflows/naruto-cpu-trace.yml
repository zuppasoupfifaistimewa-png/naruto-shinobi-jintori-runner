name: Naruto private-ROM CPU trace

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/naruto-cpu-trace.yml"

permissions:
  contents: read

concurrency:
  group: naruto-private-cpu-trace
  cancel-in-progress: true

jobs:
  trace-private-rom:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'Trace private ROM CPU state' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    env:
      API: https://api.github.com/repos/zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
      RELEASE_TAG: research-emulator-pcsx-redux-2026-10-15
      ROM_NAME: Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin
      CUE_NAME: Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue
      BIOS_NAME: openbios-chunked.bin
      EXPECTED_ROM_SIZE: "325989552"
      EXPECTED_ROM_SHA256: 58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88
      PCSX_SOURCE_COMMIT: 6b9df482d7b77b9ae218d9c48c1ce1a43c265206
      PCSX_BUILD_IMAGE: ghcr.io/grumpycoders/pcsx-redux-build@sha256:d9ae6cbb23a5d0d98d8c3702cc6f512698ee1670bf8d59b236b2baabe99a66e4

    steps:
      - name: Check required secret
        env:
          NARUTO_RESEARCH_READ_TOKEN: ${{ secrets.NARUTO_RESEARCH_READ_TOKEN }}
        run: |
          set -eu
          if [ -z "$NARUTO_RESEARCH_READ_TOKEN" ]; then
            echo "::error::Missing NARUTO_RESEARCH_READ_TOKEN. See docs/PRIVATE_ROM_SETUP.md."
            exit 1
          fi
          echo "Private release read token is present; value will not be printed."

      - name: Prepare temporary workspace
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq
          WORK="$RUNNER_TEMP/naruto-cpu-trace"
          mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          echo "Temporary workspace prepared."

      - name: Download and verify private game files and emulator
        env:
          NARUTO_RESEARCH_READ_TOKEN: ${{ secrets.NARUTO_RESEARCH_READ_TOKEN }}
        run: |
          set -eu
          cd "$WORK"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $NARUTO_RESEARCH_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/$RELEASE_TAG" -o release.json

          fetch_asset() {
            name="$1"
            output="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then
              echo "::error::Release asset missing: $name"
              exit 1
            fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $NARUTO_RESEARCH_READ_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }
          fetch_asset "$ROM_NAME" game.bin
          fetch_asset "$CUE_NAME" game.cue
          fetch_asset "$BIOS_NAME" openbios-chunked.bin
          test "$(stat -c '%s' game.bin)" = "$EXPECTED_ROM_SIZE"
          echo "$EXPECTED_ROM_SHA256  game.bin" | sha256sum --check -

          python3 - <<'PY'
          from pathlib import Path
          raw = Path("game.cue").read_bytes()
          cue = raw.decode("utf-8-sig").replace("\r\n", "\n").replace("\r", "\n")
          lines = cue.splitlines()
          file_indices = [i for i, line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          has_track = any(line.lstrip().upper().startswith("TRACK ") for line in lines)
          if len(file_indices) != 1 or not has_track:
              raise SystemExit("CUE structure invalid: expected one FILE directive and at least one TRACK directive.")
          lines[file_indices[0]] = 'FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines) + "\n", encoding="ascii")
          print("CUE structure verified; only the temporary FILE reference was normalized.")
          PY
          echo "ROM size and SHA-256 verified."

      - name: Build pinned upstream PCSX-Redux with CPU trace support
        run: |
          set -eu
          echo "PCSX_SOURCE_COMMIT=$PCSX_SOURCE_COMMIT"
          git clone --filter=blob:none --no-checkout https://github.com/grumpycoders/pcsx-redux.git "$WORK/pcsx-redux"
          git -C "$WORK/pcsx-redux" checkout --detach "$PCSX_SOURCE_COMMIT"
          git -C "$WORK/pcsx-redux" submodule update --init --recursive
          test -f "$WORK/pcsx-redux/src/core/cputrace.h"
          grep -q 'Trace = {' "$WORK/pcsx-redux/src/core/pcsxffi.lua"
          git -C "$WORK/pcsx-redux" rev-parse HEAD
          docker version
          docker pull "$PCSX_BUILD_IMAGE"
          docker image inspect --format 'PCSX_BUILD_IMAGE={{index .RepoDigests 0}}' "$PCSX_BUILD_IMAGE"
          docker run --rm -i -u "$(id -u):$(id -g)" -w /project \
            -v "$WORK/pcsx-redux:/project" \
            "$PCSX_BUILD_IMAGE" make -j2
          test -x "$WORK/pcsx-redux/pcsx-redux"
          echo "PCSX runtime shared-library dependencies inside the pinned builder image:"
          docker run --rm -u "$(id -u):$(id -g)" -w /project \
            -v "$WORK/pcsx-redux:/project" \
            "$PCSX_BUILD_IMAGE" sh -lc 'ldd /project/pcsx-redux | tee /project/pcsx-runtime-deps.txt; ! grep -q "not found" /project/pcsx-runtime-deps.txt'
          echo "PCSX_BUILD_RESULT=compiled pinned source with built-in CPU trace API; dependency check and runtime use the same builder image"

      - name: Capture boot progress and aggregate built-in CPU trace
        run: |
          set -eu
          cd "$WORK"
          FULL_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print("PAD_SETUP=port1 analog device connected and remapped")

          local vsyncs = 0
          PCSX.CPU.Trace.clear()
          PCSX.CPU.Trace.disable()

          local function summarizeTrace(window, frame)
            local total = PCSX.CPU.Trace.size()
            local first = math.max(0, total - 200)
            local counts = {}
            local sampled = 0
            for i = first, total - 1 do
              local rendered = PCSX.CPU.Trace.getLine(i)
              local pc = string.match(rendered, "^%s*([%x]+)")
              if pc then
                pc = string.lower(pc)
                counts[pc] = (counts[pc] or 0) + 1
                sampled = sampled + 1
              end
            end
            local entries = {}
            for pc, count in pairs(counts) do
              entries[#entries + 1] = { pc = pc, count = count }
            end
            table.sort(entries, function(left, right)
              if left.count == right.count then return left.pc < right.pc end
              return left.count > right.count
            end)
            print(string.format(
              "CPU_TRACE_SUMMARY window=%s frame=%d total_records=%d sampled_records=%d unique_pc=%d",
              window, frame, total, sampled, #entries))
            for i = 1, math.min(8, #entries) do
              print(string.format("CPU_TRACE_PC_HOT window=%s pc=0x%s count=%d",
                window, entries[i].pc, entries[i].count))
            end
          end

          local listener
          listener = PCSX.Events.createEventListener('GPU::Vsync', function()
            vsyncs = vsyncs + 1
            if vsyncs % 30 == 0 then
              local regs = PCSX.getRegisters()
              if regs ~= nil then
                print(string.format("GUEST_PC_SAMPLE frame=%d pc=0x%08x",
                  vsyncs, tonumber(regs.pc)))
              else
                print(string.format("GUEST_PC_SAMPLE frame=%d pc=unavailable", vsyncs))
              end
            end

            if vsyncs == 1620 or vsyncs == 4500 then
              PCSX.CPU.Trace.clear()
              PCSX.CPU.Trace.enable()
              local window = vsyncs == 1620 and "early" or "late"
              print(string.format("CPU_TRACE_WINDOW=enabled window=%s frame=%d",
                window, vsyncs))
            elseif vsyncs == 1680 then
              PCSX.CPU.Trace.disable()
              summarizeTrace("early", vsyncs)
              print("CPU_TRACE_WINDOW=disabled window=early")
            elseif vsyncs == 4560 then
              PCSX.CPU.Trace.disable()
              summarizeTrace("late", vsyncs)
              print("CPU_TRACE_WINDOW=disabled window=late")
            end
          end)
          print("VSYNC_TRACE=guest-PC sampling every 30 VSync; aggregate trace windows at frames 1620-1680 and 4500-4560")
          LUA
          )
          set +e
          mkdir -p "$WORK/home-trace"
          timeout --signal=TERM --kill-after=5s 90s \
            docker run --rm -i -u "$(id -u):$(id -g)" \
            -e HOME=/work/home-trace -e LIBGL_ALWAYS_SOFTWARE=1 -e MESA_GL_VERSION_OVERRIDE=3.3 \
            -v "$WORK:/work" -w /work "$PCSX_BUILD_IMAGE" \
            /work/pcsx-redux/pcsx-redux -no-ui \
            -bios /work/openbios-chunked.bin -iso /work/game-run.cue \
            -exec "$FULL_SETUP" -run -interpreter -softgpu \
            -stdout -lua_stdout -logfile /work/cpu-trace.log > "$WORK/cpu-trace.stdout" 2>&1
          rc=$?
          set -e
          echo "TRACE_PROCESS_EXIT=$rc (124 means the 90-second observation cap was reached; not by itself a guest crash)"

          echo "BOOT_MARKERS_BEGIN"
          grep -hE 'Loaded BIOS:|OpenBIOS detected|CD-ROM Label:|CD-ROM ID:|CD-ROM EXE Name:|SYSTEM\.CNF|BOOT =|\[CHUNK1\] done|EXEC:PC0|Execute !|Unknown command for pad|FATAL|Exception|Failed|failed|ERROR' \
            "$WORK/cpu-trace.stdout" "$WORK/cpu-trace.log" 2>/dev/null || true
          echo "BOOT_MARKERS_END"

          echo "TRACE_DIAGNOSTICS_BEGIN"
          grep -hE '^(PAD_SETUP=|GUEST_PC_SAMPLE |VSYNC_TRACE=|CPU_TRACE_WINDOW=|CPU_TRACE_SUMMARY|CPU_TRACE_PC_HOT|TRACE_RESULT=|CPU_TRACE_RESULT=)' \
            "$WORK/cpu-trace.stdout" "$WORK/cpu-trace.log" 2>/dev/null || true
          echo "TRACE_DIAGNOSTICS_END"

          if grep -q 'GUEST_PC_SAMPLE frame=' "$WORK/cpu-trace.stdout" "$WORK/cpu-trace.log" 2>/dev/null; then
            echo "TRACE_RESULT=VSync callbacks and periodic guest-PC sampling fired."
          else
            echo "TRACE_RESULT=No periodic guest-PC samples recorded; inspect boot markers before diagnosing guest behavior."
          fi
          if grep -q 'CPU_TRACE_SUMMARY window=early' "$WORK/cpu-trace.stdout" "$WORK/cpu-trace.log" 2>/dev/null; then
            echo "CPU_TRACE_RESULT=Early and/or late CPU-trace windows aggregated without printing instruction operands."
          else
            echo "CPU_TRACE_RESULT=No completed early trace summary; inspect boot markers and PC samples."
          fi
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::warning::Trace process exited before the observation cap with code $rc"
          fi

      - name: Remove temporary game files, BIOS, emulator and logs
        if: always()
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then
            rm -f "$WORK/game.bin" "$WORK/game.cue" "$WORK/game-run.cue" "$WORK/openbios-chunked.bin" "$WORK/release.json"
            rm -f "$WORK/cpu-trace.log" "$WORK/cpu-trace.stdout"
            rm -rf "$WORK/pcsx-redux" "$WORK/home-trace"
          fi
          echo "Temporary ROM, CUE, BIOS, emulator and trace logs removed from the ephemeral runner."
