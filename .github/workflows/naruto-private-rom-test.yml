name: Naruto private-ROM boot test

on:
  workflow_dispatch:
    inputs:
      run_game:
        description: "Download the ROM/CUE from the private research release and attempt a boot"
        type: boolean
        required: true
        default: false
  push:
    paths:
      - ".github/workflows/naruto-private-rom-test.yml"

permissions:
  contents: read

concurrency:
  group: naruto-private-rom-test
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ !inputs.run_game && github.event.head_commit.message != 'Run private ROM boot test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install virtual display dependencies
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri

      - name: Download and verify emulator
        env:
          APPIMAGE_URL: https://github.com/pkgforge-dev/PCSX-Redux-AppImage-Enhanced/releases/download/0c3572c3d%402026-10-01_1790876682/PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage
          EXPECTED_SHA256: c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c
        run: |
          set -eu
          WORK="$RUNNER_TEMP/naruto-smoke-only"
          mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"
          curl --fail --location --retry 2 --max-time 120 "$APPIMAGE_URL" -o pcsx-redux.AppImage
          echo "$EXPECTED_SHA256  pcsx-redux.AppImage" | sha256sum --check -
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun

      - name: Launch GUI briefly with no ROM or BIOS
        run: |
          set -eu
          cd "$WORK"
          set +e
          timeout --signal=TERM --kill-after=3s 15s \
            xvfb-run -a --server-args="-screen 0 1280x800x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 squashfs-root/AppRun > "$WORK/gui.log" 2>&1
          rc=$?
          set -e
          cat "$WORK/gui.log"
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::error::PCSX-Redux exited early with code $rc"
            exit "$rc"
          fi
          echo "GUI smoke test passed; this did not load BIOS or ROM."

      - name: Clean temporary files
        if: always()
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then rm -rf "$WORK"; fi

  boot-private-rom:
    if: ${{ inputs.run_game || github.event.head_commit.message == 'Run private ROM boot test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secret
        env:
          NARUTO_RESEARCH_READ_TOKEN: ${{ secrets.NARUTO_RESEARCH_READ_TOKEN }}
        run: |
          set -eu
          if [ -z "$NARUTO_RESEARCH_READ_TOKEN" ]; then
            echo "::error::Missing NARUTO_RESEARCH_READ_TOKEN. See docs/PRIVATE_ROM_SETUP.md."
            exit 1
          fi
          echo "Read token is present; value will not be printed."

      - name: Install headless GUI dependencies
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri jq

      - name: Download and verify public emulator
        env:
          APPIMAGE_URL: https://github.com/pkgforge-dev/PCSX-Redux-AppImage-Enhanced/releases/download/0c3572c3d%402026-10-01_1790876682/PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage
          EXPECTED_SHA256: c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c
        run: |
          set -eu
          WORK="$RUNNER_TEMP/naruto-private-boot"
          mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"
          curl --fail --location --retry 2 --max-time 120 "$APPIMAGE_URL" -o pcsx-redux.AppImage
          echo "$EXPECTED_SHA256  pcsx-redux.AppImage" | sha256sum --check -
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun

      - name: Download exact ROM, CUE and diagnostic BIOS from private release
        env:
          NARUTO_RESEARCH_READ_TOKEN: ${{ secrets.NARUTO_RESEARCH_READ_TOKEN }}
          RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          RELEASE_TAG: research-emulator-pcsx-redux-2026-10-15
          ROM_NAME: Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin
          CUE_NAME: Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue
          BIOS_NAME: openbios-chunked.bin
          EXPECTED_ROM_SHA256: 58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88
          EXPECTED_ROM_SIZE: "325989552"
        run: |
          set -eu
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $NARUTO_RESEARCH_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/$RELEASE_TAG" -o release.json

          fetch_asset() {
            name="$1"
            output="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then
              echo "::error::Release asset missing: $name. Check the private release assets."
              exit 1
            fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $NARUTO_RESEARCH_READ_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }

          fetch_asset "$ROM_NAME" game.bin
          fetch_asset "$CUE_NAME" game.cue
          fetch_asset "$BIOS_NAME" openbios-chunked.bin

          test "$(stat -c '%s' game.bin)" = "$EXPECTED_ROM_SIZE"
          echo "$EXPECTED_ROM_SHA256  game.bin" | sha256sum --check -
          grep -q '^FILE ' game.cue
          grep -q '^TRACK ' game.cue
          # Keep uploaded CUE unchanged; normalize only this ephemeral local copy.
          sed -E 's/^FILE .*/FILE "game.bin" BINARY/' game.cue > game-run.cue
          grep -q '^FILE "game.bin" BINARY$' game-run.cue
          grep -q '^TRACK ' game-run.cue
          echo "ROM size and SHA-256 verified. CUE structure verified and its local file reference normalized."

      - name: Attempt bounded boot with logs
        run: |
          set -eu
          cd "$WORK"
          mkdir -p profile
          set +e
          timeout --signal=TERM --kill-after=5s 90s \
            xvfb-run -a --server-args="-screen 0 1280x800x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 squashfs-root/AppRun \
            -portable "$WORK/profile" \
            -bios "$WORK/openbios-chunked.bin" \
            -iso "$WORK/game-run.cue" \
            -run -interpreter -debugger -stdout -lua_stdout \
            -logfile "$WORK/boot.log" > "$WORK/gui.log" 2>&1
          rc=$?
          set -e
          echo "Emulator process exit status: $rc"
          if [ -f "$WORK/boot.log" ]; then
            grep -E 'SYSTEM.CNF|EXEC:PC0|CD-ROM|CDROM|Error|ERROR|Unknown command for pad|FATAL|Exception' "$WORK/boot.log" | tail -100 || true
          fi
          tail -100 "$WORK/gui.log" || true
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::error::Emulator exited early. Inspect log excerpts above."
            exit "$rc"
          fi
          echo "Bounded boot attempt completed; this does not independently prove visible title/menu or playable input."

      - name: Remove private media
        if: always()
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then
            rm -f "$WORK/game.bin" "$WORK/game.cue" "$WORK/game-run.cue" "$WORK/openbios-chunked.bin" "$WORK/release.json"
            rm -f "$WORK/boot.log" "$WORK/gui.log"
            rm -rf "$WORK/squashfs-root" "$WORK/profile"
          fi
          echo "Private ROM/BIOS files and local logs removed from the ephemeral runner."
