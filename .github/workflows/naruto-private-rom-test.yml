name: Naruto private-ROM boot test

on:
  workflow_dispatch:
    inputs:
      run_game:
        description: "Download the ROM/CUE from the private research release and attempt a boot"
        type: boolean
        required: true
        default: false
  push:
    paths:
      - ".github/workflows/naruto-private-rom-test.yml"

permissions:
  contents: read

concurrency:
  group: naruto-private-rom-test
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ !inputs.run_game && github.event.head_commit.message != 'Run private ROM boot test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install virtual display dependencies
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri

      - name: Download and verify emulator
        env:
          APPIMAGE_URL: https://github.com/pkgforge-dev/PCSX-Redux-AppImage-Enhanced/releases/download/0c3572c3d%402026-10-01_1790876682/PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage
          EXPECTED_SHA256: c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c
        run: |
          set -eu
          WORK="$RUNNER_TEMP/naruto-smoke-only"
          mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"
          curl --fail --location --retry 2 --max-time 120 "$APPIMAGE_URL" -o pcsx-redux.AppImage
          echo "$EXPECTED_SHA256  pcsx-redux.AppImage" | sha256sum --check -
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun

      - name: Launch GUI briefly with no ROM or BIOS
        run: |
          set -eu
          cd "$WORK"
          set +e
          timeout --signal=TERM --kill-after=3s 15s \
            xvfb-run -a --server-args="-screen 0 1280x800x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 squashfs-root/AppRun > "$WORK/gui.log" 2>&1
          rc=$?
          set -e
          cat "$WORK/gui.log"
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::error::PCSX-Redux exited early with code $rc"
            exit "$rc"
          fi
          echo "GUI smoke test passed; this did not load BIOS or ROM."

      - name: Clean temporary files
        if: always()
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then rm -rf "$WORK"; fi

  boot-private-rom:
    if: ${{ inputs.run_game || github.event.head_commit.message == 'Run private ROM boot test' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - name: Check required secret
        env:
          NARUTO_RESEARCH_READ_TOKEN: ${{ secrets.NARUTO_RESEARCH_READ_TOKEN }}
        run: |
          set -eu
          if [ -z "$NARUTO_RESEARCH_READ_TOKEN" ]; then
            echo "::error::Missing NARUTO_RESEARCH_READ_TOKEN. See docs/PRIVATE_ROM_SETUP.md."
            exit 1
          fi
          echo "Read token is present; value will not be printed."

      - name: Install headless GUI dependencies
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri mesa-utils jq imagemagick tesseract-ocr tesseract-ocr-jpn xdotool x11-utils

      - name: Download and extract the pinned AnyLinux build
        env:
          APPIMAGE_URL: https://github.com/pkgforge-dev/PCSX-Redux-AppImage-Enhanced/releases/download/0c3572c3d%402026-10-01_1790876682/PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage
          EXPECTED_SHA256: c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c
        run: |
          set -eu
          WORK="$RUNNER_TEMP/naruto-private-boot"
          mkdir -p "$WORK/anylinux"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"
          curl --fail --location --retry 2 --max-time 120 "$APPIMAGE_URL" -o anylinux.AppImage
          echo "$EXPECTED_SHA256  anylinux.AppImage" | sha256sum --check -
          chmod +x anylinux.AppImage
          ( cd "$WORK/anylinux" && ../anylinux.AppImage --appimage-extract >/dev/null && test -x squashfs-root/AppRun )
          echo "AnyLinux build extracted successfully; SHA-256 was verified."
      - name: Download exact ROM, CUE and diagnostic BIOS from private release
        env:
          NARUTO_RESEARCH_READ_TOKEN: ${{ secrets.NARUTO_RESEARCH_READ_TOKEN }}
          RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          RELEASE_TAG: research-emulator-pcsx-redux-2026-10-15
          ROM_NAME: Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin
          CUE_NAME: Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue
          BIOS_NAME: openbios-chunked.bin
          PCSX_HEAD_NAME: PCSX-Redux-HEAD-x86_64.AppImage
          PCSX_HEAD_EXPECTED_SHA256: 5b2bf850afea345ff1428a38ea75d1776a1857832acf873d9d72d3f4d214b0f8
          EXPECTED_ROM_SHA256: 58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88
          EXPECTED_ROM_SIZE: "325989552"
        run: |
          set -eu
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $NARUTO_RESEARCH_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/$RELEASE_TAG" -o release.json

          fetch_asset() {
            name="$1"
            output="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then
              echo "::error::Release asset missing: $name. Check the private release assets."
              exit 1
            fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $NARUTO_RESEARCH_READ_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }

          fetch_asset "$ROM_NAME" game.bin
          fetch_asset "$CUE_NAME" game.cue
          fetch_asset "$BIOS_NAME" openbios-chunked.bin
          fetch_asset "$PCSX_HEAD_NAME" pcsx-head.AppImage
          echo "$PCSX_HEAD_EXPECTED_SHA256  pcsx-head.AppImage" | sha256sum --check -
          chmod +x pcsx-head.AppImage
          mkdir -p "$WORK/head"
          ( cd "$WORK/head" && ../pcsx-head.AppImage --appimage-extract >/dev/null && test -x squashfs-root/AppRun )
          echo "Upstream HEAD AppImage size and SHA-256 (for build comparison):"
          stat -c '%n %s bytes' pcsx-head.AppImage
          sha256sum pcsx-head.AppImage

          test "$(stat -c '%s' game.bin)" = "$EXPECTED_ROM_SIZE"
          echo "$EXPECTED_ROM_SHA256  game.bin" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path
          raw = Path("game.cue").read_bytes()
          cue = raw.decode("utf-8-sig").replace("\r\n", "\n").replace("\r", "\n")
          lines = cue.splitlines()
          file_indices = [i for i, line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          has_track = any(line.lstrip().upper().startswith("TRACK ") for line in lines)
          if len(file_indices) != 1 or not has_track:
              raise SystemExit("CUE structure invalid: expected exactly one FILE directive and at least one TRACK directive.")
          lines[file_indices[0]] = 'FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines) + "\n", encoding="ascii")
          print("CUE structure verified; normalized only the temporary FILE reference.")
          PY
          echo "ROM size and SHA-256 verified; source CUE is unchanged."

      - name: Compare AnyLinux and upstream HEAD using the same private ROM
        run: |
          set -eu
          cd "$WORK"
          # Match PCSX-Redux's own Analog-pad setup: setting the type alone is not enough;
          # it is cached at map() time, so connect and remap after setting it.
          PAD_SETUP=$(cat <<'LUA'
          PCSX.settings.pads[1].DeviceType = 'Analog'
          PCSX.settings.pads[1].Connected = true
          PCSX.SIO0.slots[1].pads[1].map()
          print("PAD_SETUP=port1 analog device connected and remapped")
          LUA
          )
          export PAD_SETUP
          run_probe() {
            name="$1"
            app="$2"
            home="$WORK/home-$name"
            mkdir -p "$home"
            echo "===== BUILD: $name (Port 1 forced Analog) ====="
            set +e
            timeout --signal=TERM --kill-after=5s 90s \
              env HOME="$home" LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 \
              "$app" -no-ui -bios "$WORK/openbios-chunked.bin" -iso "$WORK/game-run.cue" \
              -exec "$PAD_SETUP" -run -interpreter -softgpu -stdout -lua_stdout -logfile "$WORK/$name.log" \
              > "$WORK/$name.stdout" 2>&1
            rc=$?
            set -e
            echo "PROCESS_EXIT=$rc (124 means the 90-second limit was reached)"
            echo "Relevant startup, executable and controller markers:"
            grep -E 'PAD_SETUP=|Loaded BIOS:|OpenBIOS detected|CD-ROM Label:|CD-ROM ID:|CD-ROM EXE Name:|SYSTEM.CNF|BOOT =|\[CHUNK1\] done|EXEC:PC0|Execute !|Unknown command for pad|FATAL|Exception|Error|ERROR' "$WORK/$name.stdout" "$WORK/$name.log" 2>/dev/null | tail -100 || true
            if grep -q 'EXEC:PC0' "$WORK/$name.stdout" "$WORK/$name.log" 2>/dev/null; then
              echo "BOOT_RESULT=$name reached EXEC:PC0 (game executable entered)."
            else
              echo "BOOT_RESULT=$name did not record EXEC:PC0 within the bound."
            fi
            if grep -q 'Unknown command for pad: 43' "$WORK/$name.stdout" "$WORK/$name.log" 2>/dev/null; then
              echo "PAD_RESULT=$name logged unrecognized controller command 0x43."
            else
              echo "PAD_RESULT=$name did not log unknown controller command 0x43."
            fi
            if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
              echo "::warning::Build $name exited early with code $rc"
              echo "Full captured stdout/stderr for early exit:"
              tail -120 "$WORK/$name.stdout" || true
              target="$(readlink -f "$app" || true)"
              echo "Resolved AppRun target: $target"
              if [ -n "$target" ] && [ -f "$target" ]; then
                file "$target" || true
                ldd "$target" 2>&1 | grep -E 'not found|statically linked|not a dynamic executable' || true
              fi
            fi
          }
          run_probe anylinux "$WORK/anylinux/squashfs-root/AppRun"
          run_probe upstream-head "$WORK/head/squashfs-root/AppRun"

          # Compare GUI rendering for both AppImages, using separate fresh profiles and Xvfb servers.
          cat > "$WORK/gui_probe.sh" <<'SH'
          #!/usr/bin/env bash
          set -eu
          log_prefix="$WORK/gui-$GUI_LABEL"
          timeout --signal=TERM --kill-after=4s 100s env \
            HOME="$GUI_HOME" LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 \
            "$APP_PATH" -bios "$WORK/openbios-chunked.bin" -iso "$WORK/game-run.cue" \
            -exec "$PAD_SETUP" -run -interpreter -softgpu -stdout -lua_stdout \
            -logfile "$log_prefix.log" > "$log_prefix.stdout" 2>&1 &
          emu_pid=$!
          capture_emulator_window() {
            label="$1"
            output="$2"
            xwininfo -root -tree > "$WORK/window-tree-$GUI_LABEL.txt" 2>&1 || true
            window_id="$(xdotool search --onlyvisible --name 'PCSX-Redux|PCSX|pcsx|Redux|redux' 2>/dev/null | head -n 1 || true)"
            if [ -z "$window_id" ]; then
              window_id="$(xdotool search --onlyvisible --class 'PCSX-Redux|PCSX|pcsx|Redux|redux' 2>/dev/null | head -n 1 || true)"
            fi
            if [ -z "$window_id" ]; then
              echo "CAPTURE_RESULT=$GUI_LABEL/$label no visible PCSX-Redux window found; refusing to substitute Xvfb root."
              sed -n '1,80p' "$WORK/window-tree-$GUI_LABEL.txt" || true
              return 1
            fi
            echo "CAPTURE_WINDOW=$GUI_LABEL/$label id=$window_id"
            import -window "$window_id" -silent "$output"
          }
          sleep 30
          capture_emulator_window frame-30 "$log_prefix-frame-30.png" || true
          sleep 30
          capture_emulator_window frame-60 "$log_prefix-frame-60.png" || true
          sleep 30
          capture_emulator_window frame-90 "$log_prefix-frame-90.png" || true
          set +e
          wait "$emu_pid"
          rc=$?
          set -e
          echo "GUI_PROCESS_EXIT=$GUI_LABEL/$rc (124 is expected at the 100-second observation cap)"
          for frame in "$log_prefix-frame-30.png" "$log_prefix-frame-60.png" "$log_prefix-frame-90.png"; do
            echo "FRAME=$frame"
            if [ ! -f "$frame" ]; then
              echo "FRAME_RESULT=not captured from an emulator window"
              continue
            fi
            identify -format 'FRAME_METRICS label=%f width=%w height=%h mean=%[mean] stddev=%[standard-deviation] colors=%k\\n' "$frame"
            echo "OCR_TEXT_BEGIN label=$GUI_LABEL"
            tesseract "$frame" stdout -l jpn+eng 2>/dev/null | head -20 || true
            echo "OCR_TEXT_END label=$GUI_LABEL"
          done
          echo "GUI boot and pad markers ($GUI_LABEL):"
          grep -E 'PAD_SETUP=|Loaded BIOS:|OpenBIOS detected|CD-ROM Label:|CD-ROM EXE Name:|EXEC:PC0|Execute !|Unknown command for pad|FATAL|Exception|Error|ERROR' "$log_prefix.stdout" "$log_prefix.log" 2>/dev/null | tail -50 || true
          if grep -q 'PAD_SETUP=port1 analog device connected and remapped' "$log_prefix.stdout" "$log_prefix.log" 2>/dev/null; then
            echo "GUI_LUA_RESULT=$GUI_LABEL setup marker observed"
          else
            echo "GUI_LUA_RESULT=$GUI_LABEL setup marker absent"
          fi
          if grep -q 'EXEC:PC0(80011448)' "$log_prefix.stdout" "$log_prefix.log" 2>/dev/null; then
            echo "GUI_BOOT_RESULT=$GUI_LABEL reached executable entry"
          else
            echo "GUI_BOOT_RESULT=$GUI_LABEL did not reach/log executable entry in GUI mode"
          fi
          if grep -q 'Unknown command for pad: 43' "$log_prefix.stdout" "$log_prefix.log" 2>/dev/null; then
            echo "GUI_PAD_RESULT=$GUI_LABEL unrecognized command 0x43 present"
          else
            echo "GUI_PAD_RESULT=$GUI_LABEL no unrecognized command 0x43 observed"
          fi
          SH
          chmod +x "$WORK/gui_probe.sh"
          echo "===== GUI PROBE: GL capability under same Xvfb/software-rendering environment ====="
          timeout 15s xvfb-run -a --server-args="-screen 0 1280x800x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 glxinfo -B 2>&1 | head -60 || true

          run_gui_probe() {
            label="$1"
            app_path="$2"
            export GUI_LABEL="$label" GUI_HOME="$WORK/home-gui-$label" APP_PATH="$app_path"
            mkdir -p "$GUI_HOME"
            echo "===== GUI PROBE: $label with private ROM and Port 1 Analog ====="
            timeout --signal=TERM --kill-after=5s 115s xvfb-run -a \
              --server-args="-screen 0 1280x800x24" bash "$WORK/gui_probe.sh"
            echo "===== GUI detailed stdout tail: $label (temporary) ====="
            tail -80 "$WORK/gui-$label.stdout" 2>/dev/null || true
            echo "===== GUI detailed PCSX logfile tail: $label (temporary) ====="
            tail -80 "$WORK/gui-$label.log" 2>/dev/null || true
          }
          # Same ROM/CUE, BIOS, pad setup, observation windows, Xvfb geometry and renderer.
          run_gui_probe anylinux "$WORK/anylinux/squashfs-root/AppRun"
          run_gui_probe upstream-head "$WORK/head/squashfs-root/AppRun"
          echo "GUI comparison complete. A timeout or EXEC:PC0 marker alone does not prove a visible title screen or playable input."
      - name: Remove private media and both emulator builds
        if: always()
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then
            rm -f "$WORK/game.bin" "$WORK/game.cue" "$WORK/game-run.cue" "$WORK/openbios-chunked.bin" "$WORK/release.json"
            rm -f "$WORK/pcsx-head.AppImage" "$WORK/anylinux.AppImage"
            rm -f "$WORK/boot.log" "$WORK/gui.log" "$WORK/frame.png" "$WORK/ocr.tsv" "$WORK/probe_screen.py"
            rm -f "$WORK/anylinux.log" "$WORK/anylinux.stdout" "$WORK/upstream-head.log" "$WORK/upstream-head.stdout" "$WORK/gui-probe.log" "$WORK/gui-probe.stdout" "$WORK/gui-frame-10.png" "$WORK/gui-frame-20.png" "$WORK/gui-frame-30.png" "$WORK/gui-frame-60.png" "$WORK/gui-frame-90.png" "$WORK/gui_probe.sh" "$WORK/window-tree.txt"
            rm -f "$WORK"/gui-anylinux.log "$WORK"/gui-anylinux.stdout "$WORK"/gui-anylinux-frame-*.png "$WORK"/gui-upstream-head.log "$WORK"/gui-upstream-head.stdout "$WORK"/gui-upstream-head-frame-*.png "$WORK"/window-tree-anylinux.txt "$WORK"/window-tree-upstream-head.txt
            rm -rf "$WORK/anylinux" "$WORK/head" "$WORK/home" "$WORK/home-anylinux" "$WORK/home-upstream-head" "$WORK/home-gui-anylinux" "$WORK/home-gui-upstream-head" "$WORK/squashfs-root" "$WORK/profile"
          fi
          echo "Private ROM/BIOS files, profiles, logs and both extracted emulator trees removed from the ephemeral runner."
