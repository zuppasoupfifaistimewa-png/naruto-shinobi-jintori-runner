name: Naruto private-ROM boot test

on:
  workflow_dispatch:
    inputs:
      run_game:
        description: "Download the ROM/CUE from the private research release and attempt a boot"
        type: boolean
        required: true
        default: false
  push:
    paths:
      - ".github/workflows/naruto-private-rom-test.yml"

permissions:
  contents: read

concurrency:
  group: naruto-private-rom-test
  cancel-in-progress: true

jobs:
  smoke:
    if: ${{ !inputs.run_game && github.event.head_commit.message != 'Run private ROM boot test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install virtual display dependencies
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri

      - name: Download and verify emulator
        env:
          APPIMAGE_URL: https://github.com/pkgforge-dev/PCSX-Redux-AppImage-Enhanced/releases/download/0c3572c3d%402026-10-01_1790876682/PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage
          EXPECTED_SHA256: c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c
        run: |
          set -eu
          WORK="$RUNNER_TEMP/naruto-smoke-only"
          mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"
          curl --fail --location --retry 2 --max-time 120 "$APPIMAGE_URL" -o pcsx-redux.AppImage
          echo "$EXPECTED_SHA256  pcsx-redux.AppImage" | sha256sum --check -
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun

      - name: Launch GUI briefly with no ROM or BIOS
        run: |
          set -eu
          cd "$WORK"
          set +e
          timeout --signal=TERM --kill-after=3s 15s \
            xvfb-run -a --server-args="-screen 0 1280x800x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 squashfs-root/AppRun > "$WORK/gui.log" 2>&1
          rc=$?
          set -e
          cat "$WORK/gui.log"
          if [ "$rc" -ne 124 ] && [ "$rc" -ne 0 ]; then
            echo "::error::PCSX-Redux exited early with code $rc"
            exit "$rc"
          fi
          echo "GUI smoke test passed; this did not load BIOS or ROM."

      - name: Clean temporary files
        if: always()
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then rm -rf "$WORK"; fi

  boot-private-rom:
    if: ${{ inputs.run_game || github.event.head_commit.message == 'Run private ROM boot test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check required secret
        env:
          NARUTO_RESEARCH_READ_TOKEN: ${{ secrets.NARUTO_RESEARCH_READ_TOKEN }}
        run: |
          set -eu
          if [ -z "$NARUTO_RESEARCH_READ_TOKEN" ]; then
            echo "::error::Missing NARUTO_RESEARCH_READ_TOKEN. See docs/PRIVATE_ROM_SETUP.md."
            exit 1
          fi
          echo "Read token is present; value will not be printed."

      - name: Install headless GUI dependencies
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1-mesa-dri jq

      - name: Download and verify public emulator
        env:
          APPIMAGE_URL: https://github.com/pkgforge-dev/PCSX-Redux-AppImage-Enhanced/releases/download/0c3572c3d%402026-10-01_1790876682/PCSX-Redux-0c3572c3d-anylinux-x86_64.AppImage
          EXPECTED_SHA256: c04b3e0a592abbb38bac34fb75551694aaf3a7d4ff18e9fc7b8e2c05bd60fc0c
        run: |
          set -eu
          WORK="$RUNNER_TEMP/naruto-private-boot"
          mkdir -p "$WORK"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          cd "$WORK"
          curl --fail --location --retry 2 --max-time 120 "$APPIMAGE_URL" -o pcsx-redux.AppImage
          echo "$EXPECTED_SHA256  pcsx-redux.AppImage" | sha256sum --check -
          chmod +x pcsx-redux.AppImage
          ./pcsx-redux.AppImage --appimage-extract >/dev/null
          test -x squashfs-root/AppRun

      - name: Download exact ROM, CUE and diagnostic BIOS from private release
        env:
          NARUTO_RESEARCH_READ_TOKEN: ${{ secrets.NARUTO_RESEARCH_READ_TOKEN }}
          RESEARCH_REPO: zuppasoupfifaistimewa-png/naruto-shinobi-jintori-research
          RELEASE_TAG: research-emulator-pcsx-redux-2026-10-15
          ROM_NAME: Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.bin
          CUE_NAME: Naruto.-.Shinobi.no.Sato.no.Jintori.Gassen.Japan.cue
          BIOS_NAME: openbios-chunked.bin
          EXPECTED_ROM_SHA256: 58c389a794375b7b81b3a18877ef7965356a1332285a3590170efbf2359a3b88
          EXPECTED_ROM_SIZE: "325989552"
        run: |
          set -eu
          cd "$WORK"
          API="https://api.github.com/repos/$RESEARCH_REPO"
          curl --fail --silent --show-error --location --max-time 30 \
            -H "Authorization: Bearer $NARUTO_RESEARCH_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$API/releases/tags/$RELEASE_TAG" -o release.json

          fetch_asset() {
            name="$1"
            output="$2"
            id="$(jq -r --arg name "$name" '.assets[]? | select(.name == $name) | .id' release.json | head -n 1)"
            if [ -z "$id" ] || [ "$id" = "null" ]; then
              echo "::error::Release asset missing: $name. Check the private release assets."
              exit 1
            fi
            curl --fail --silent --show-error --location --retry 2 --max-time 300 \
              -H "Authorization: Bearer $NARUTO_RESEARCH_READ_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$API/releases/assets/$id" -o "$output"
          }

          fetch_asset "$ROM_NAME" game.bin
          fetch_asset "$CUE_NAME" game.cue
          fetch_asset "$BIOS_NAME" openbios-chunked.bin

          test "$(stat -c '%s' game.bin)" = "$EXPECTED_ROM_SIZE"
          echo "$EXPECTED_ROM_SHA256  game.bin" | sha256sum --check -
          python3 - <<'PY'
          from pathlib import Path
          raw = Path("game.cue").read_bytes()
          cue = raw.decode("utf-8-sig").replace("\r\n", "\n").replace("\r", "\n")
          lines = cue.splitlines()
          file_indices = [i for i, line in enumerate(lines) if line.lstrip().upper().startswith("FILE ")]
          has_track = any(line.lstrip().upper().startswith("TRACK ") for line in lines)
          if len(file_indices) != 1 or not has_track:
              raise SystemExit("CUE structure invalid: expected exactly one FILE directive and at least one TRACK directive.")
          lines[file_indices[0]] = 'FILE "game.bin" BINARY'
          Path("game-run.cue").write_text("\n".join(lines) + "\n", encoding="ascii")
          print("CUE structure verified; normalized only the temporary FILE reference.")
          PY
          echo "ROM size and SHA-256 verified; source CUE is unchanged."

      - name: Capture emulator window and summarize OCR privately
        run: |
          set -eu
          sudo apt-get install -y --no-install-recommends imagemagick tesseract-ocr tesseract-ocr-jpn x11-utils mesa-utils
          cd "$WORK"
          cat > "$WORK/probe_screen.py" <<'PY'
          import csv, re, subprocess, sys
          from pathlib import Path

          screen = sys.argv[1]
          tsv_base = sys.argv[2]
          tree = subprocess.run(["xwininfo", "-root", "-tree"], check=True, capture_output=True, text=True).stdout
          win_id = None
          for line in tree.splitlines():
              if re.search(r'"[^"]*pcsx', line, flags=re.IGNORECASE):
                  match = re.match(r'\s*(0x[0-9a-fA-F]+)', line)
                  if match:
                      win_id = match.group(1)
                      break
          if not win_id:
              print("No PCSX-named X11 window found; no game-screen claim can be made.")
              print("Visible top-level window titles:", [re.findall(r'"([^"]*)"', line)[:1] for line in tree.splitlines() if '"' in line][:12])
              raise SystemExit(1)
          subprocess.run(["import", "-window", win_id, screen], check=True)
          stats = subprocess.run(["identify", "-format", "%w %h %[fx:mean] %[fx:standard_deviation]", screen], check=True, capture_output=True, text=True).stdout
          print("PCSX window capture (width height mean stddev):", stats)
          subprocess.run(["tesseract", screen, tsv_base, "-l", "jpn+eng", "tsv"], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          tsv_path = tsv_base + ".tsv"
          with open(tsv_path, newline="", encoding="utf-8") as fh:
              rows = list(csv.DictReader(fh, delimiter=chr(9)))
          words = []
          for row in rows:
              value = (row.get("text") or "").strip()
              try:
                  confidence = float(row.get("conf", "-1"))
              except ValueError:
                  confidence = -1
              if row.get("level") == "5" and value and confidence >= 30:
                  words.append(value)
          joined = " ".join(words).lower()
          marker = ("naruto" in joined) or ("ナルト" in joined)
          print("OCR word count (confidence >= 30):", len(words))
          print("OCR detected a Naruto marker:", "yes" if marker else "no/uncertain")
          PY
          set +e
          timeout --signal=TERM --kill-after=5s 50s \
            xvfb-run -a --server-args="-screen 0 1280x800x24 +extension GLX +render -noreset" \
            bash -c '
              set -eu
              echo "GLX software-renderer details:"
              LIBGL_ALWAYS_SOFTWARE=1 glxinfo -B || true
              env HOME="$WORK/home" LIBGL_ALWAYS_SOFTWARE=1 MESA_GL_VERSION_OVERRIDE=3.3 "$WORK/squashfs-root/AppRun" \
                -bios "$WORK/openbios-chunked.bin" \
                -iso "$WORK/game-run.cue" \
                -run -interpreter -softgpu -stdout -lua_stdout \
                -logfile "$WORK/boot.log" > "$WORK/gui.log" 2>&1 &
              emu_pid=$!
              sleep 25
              if ! kill -0 "$emu_pid" 2>/dev/null; then
                echo "Emulator exited before screen capture."
                tail -80 "$WORK/gui.log" || true
                exit 1
              fi
              python3 "$WORK/probe_screen.py" "$WORK/frame.png" "$WORK/ocr"
              echo "Selected emulator diagnostics:"
              grep -E "CD-ROM Label|CD-ROM ID|CD-ROM EXE Name|SYSTEM.CNF|EXEC:PC0|Error|ERROR|FATAL|Exception" "$WORK/boot.log" | tail -80 || true
              tail -40 "$WORK/gui.log" || true
              pkill -TERM -P "$emu_pid" 2>/dev/null || true
              kill -TERM "$emu_pid" 2>/dev/null || true
              sleep 2
              pkill -KILL -P "$emu_pid" 2>/dev/null || true
              kill -KILL "$emu_pid" 2>/dev/null || true
            '
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::error::Screenshot/OCR boot probe failed with exit code $rc"
            exit "$rc"
          fi
          echo "Screen capture and OCR remain on the ephemeral runner; no image artifact is uploaded."
      - name: Remove private media
        if: always()
        run: |
          if [ -n "${WORK:-}" ] && [ -d "$WORK" ]; then
            rm -f "$WORK/game.bin" "$WORK/game.cue" "$WORK/game-run.cue" "$WORK/openbios-chunked.bin" "$WORK/release.json"
            rm -f "$WORK/boot.log" "$WORK/gui.log" "$WORK/frame.png" "$WORK/ocr.tsv" "$WORK/probe_screen.py"
            rm -rf "$WORK/squashfs-root" "$WORK/profile"
          fi
          echo "Private ROM/BIOS files and local logs removed from the ephemeral runner."
